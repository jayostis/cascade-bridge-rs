name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  # Nothing pins the counterparts; nightly notices when their default branches move.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The names are required status checks on main: a renamed job leaves every
  # merge waiting on a check that never reports.
  compatibility:
    name: compatibility
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Checked out, cached and built before start, which checks out only what is missing
      # and finds the package already built.
      - uses: actions/checkout@v7
        with:
          path: ${{ github.event.repository.name }}
          persist-credentials: false
      - run: rustc --version
        working-directory: ${{ github.event.repository.name }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ github.event.repository.name }}
          key: ${{ hashFiles(format('{0}/Cargo.toml', github.event.repository.name)) }}
      # build.sh fetches its tools into target/, which rust-cache does not keep.
      - uses: actions/cache@v6
        with:
          path: ${{ github.event.repository.name }}/target/wasm-bindgen-*
          key: package-tools-fast-${{ hashFiles(format('{0}/Cargo.lock', github.event.repository.name), format('{0}/package/build.sh', github.event.repository.name)) }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: sh package/build.sh --fast
        working-directory: ${{ github.event.repository.name }}
      - uses: jayostis/cascade-bridge-spec/.github/actions/start@main
      - run: cargo test --locked -p cascade-bridge-cli --test node_host --test specification_vector -- --include-ignored
        working-directory: ${{ github.event.repository.name }}
      - run: node --test package/tests/
        working-directory: ${{ github.event.repository.name }}
      - run: npx --yes typescript@7.0.2 --noEmit --strict package/tests/consumer.ts
        working-directory: ${{ github.event.repository.name }}

  ready-to-merge:
    name: ready-to-merge
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: jayostis/cascade-bridge-spec/.github/actions/start@main
        with:
          check: ready-to-merge
