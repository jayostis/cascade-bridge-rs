name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: tests, format and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml names the version and its components; rustup on the
      # runner installs exactly that, so CI and a checkout compile alike.
      - run: rustc --version
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
