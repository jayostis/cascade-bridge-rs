name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  # Nothing pins the counterparts, so a green run goes stale as their default
  # branches move; nightly is what notices.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: tests, format and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml names the version and its components; rustup on the
      # runner installs exactly that, so CI and a checkout compile alike.
      - run: rustc --version
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # The names are required status checks on main: a renamed job leaves every
  # merge waiting on a check that never reports.
  compatibility:
    name: compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: jayostis/cascade-bridge-spec/.github/actions/start@main

  ready-to-merge:
    name: ready-to-merge
    runs-on: ubuntu-latest
    steps:
      - uses: jayostis/cascade-bridge-spec/.github/actions/start@main
        with:
          check: ready-to-merge
