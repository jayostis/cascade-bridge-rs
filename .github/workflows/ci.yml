name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  # Nothing pins the counterparts, so a green run goes stale as their default
  # branches move; nightly is what notices.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

# A run supersedes the one before it, except that an edited description never
# cancels a run testing code: the test job skips an edit, and a cancelled run
# beside a skipped one would leave its required check green untested.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event.action == 'edited' && 'edited' || 'code' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The names are required status checks on main: a renamed job leaves every
  # merge waiting on a check that never reports. A skipped job reports as
  # passed.
  test:
    name: tests, format and lints
    # An edited description and a counterpart's move change none of this
    # repository's code; the compatibility job is what reads them.
    if: github.event.action != 'edited' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # rust-toolchain.toml names the version and its components; rustup on the
      # runner installs exactly that, so CI and a checkout compile alike.
      - run: rustc --version
      - uses: Swatinem/rust-cache@v2
      # rust-cache keeps dependencies, not the tools setup.sh fetches into
      # target/; their versions are pinned in these two files.
      - uses: actions/cache@v6
        with:
          path: |
            target/wasm-bindgen-*
            target/binaryen-*
          key: node-host-tools-${{ hashFiles('Cargo.lock', 'hosts/node/setup.sh') }}
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: sh hosts/node/setup.sh
      - run: cargo clippy --locked -p cascade-bridge-wasm --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --locked

  compatibility:
    name: compatibility
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # start checks this repository out only where it is not already there, and
      # its first act is compatibility.json's release build, in this directory.
      # Restoring the cache ahead of start is what lets the longest build in the
      # job start from anything but cold.
      - uses: actions/checkout@v7
        with:
          path: ${{ github.event.repository.name }}
          persist-credentials: false
      - run: rustc --version
        working-directory: ${{ github.event.repository.name }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ github.event.repository.name }}
      # start leaves cascade-bridge-spec beside this checkout at the version the
      # run picked, which is where the vector reads it from and the only place
      # the two halves are one version: against a default branch, a pull request
      # changing both would prove the new engine against the old expectations.
      - uses: jayostis/cascade-bridge-spec/.github/actions/start@main
      # cargo test skips what is #[ignore]d, and the vector is ignored because a
      # checkout of this repository on its own cannot run it.
      - run: cargo test --locked -- --ignored
        working-directory: ${{ github.event.repository.name }}

  ready-to-merge:
    name: ready-to-merge
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: jayostis/cascade-bridge-spec/.github/actions/start@main
        with:
          check: ready-to-merge
