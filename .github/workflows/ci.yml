name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  # Nothing pins the counterparts; nightly notices when their default branches move.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The names are required status checks on main: a renamed job leaves every
  # merge waiting on a check that never reports.
  compatibility:
    name: compatibility
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Checked out, cached and built before start, which checks out only what is missing
      # and finds the package already built.
      - uses: actions/checkout@v7
        with:
          path: ${{ github.event.repository.name }}
          persist-credentials: false
      # The runner images preinstall different toolchains, and rust-cache hashes every one it finds into its key.
      # It runs outside the checkout, so it reads the default toolchain, not the pinned one.
      - run: |
          rustup toolchain install --profile minimal
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup default "$channel"
          rustup toolchain list | cut -d' ' -f1 | grep -v "^$channel-" | xargs -r -n1 rustup toolchain uninstall
        working-directory: ${{ github.event.repository.name }}
      - run: rustc --version
        working-directory: ${{ github.event.repository.name }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ github.event.repository.name }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # build.sh fetches its tools into target/, which rust-cache does not keep.
      - uses: actions/cache@v6
        with:
          path: ${{ github.event.repository.name }}/target/wasm-bindgen-*
          key: package-tools-fast-${{ hashFiles(format('{0}/Cargo.lock', github.event.repository.name), format('{0}/package/build.sh', github.event.repository.name)) }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: sh package/build.sh --fast
        working-directory: ${{ github.event.repository.name }}
      - uses: jayostis/cascade-bridge-spec/.github/actions/start@main
      - run: cargo test --locked -p cascade-bridge-cli --test node_host --test specification_vector -- --include-ignored
        working-directory: ${{ github.event.repository.name }}
      - run: node --test package/tests/
        working-directory: ${{ github.event.repository.name }}
      - run: npx --yes typescript@7.0.2 --noEmit --strict package/tests/consumer.ts
        working-directory: ${{ github.event.repository.name }}
      # A required check, so a pull request whose compiler change makes a shipped query fall back to
      # stock Oxigraph cannot merge. It reads the compiler's decision on every query of each adapter, whatever
      # the executor, from the release build that start made.
      - name: no shipped adapter query falls back to stock Oxigraph
        run: |
          set -o pipefail
          failed=0
          for adapter in ccda fhir-r4 clinvar; do
            directory="../cascade-bridge-adapter-$adapter"
            vocabulary=$(jq -r '."@graph"[] | ."bridge:cascadeVocabularyRepository"."@id" // empty' "$directory/ro-crate-metadata.json")
            fallbacks="$RUNNER_TEMP/fallbacks-$adapter.json"
            cargo run --release --locked -q -p cascade-bridge-cli -- test "$directory" --vocabularies "../${vocabulary##*/}" --fallbacks "$fallbacks" > /dev/null || failed=1
            bash .github/scripts/no-fallbacks.sh "$adapter" "$fallbacks" | tee -a "$GITHUB_STEP_SUMMARY" || failed=1
          done
          exit "$failed"
        working-directory: ${{ github.event.repository.name }}
