name: test

# Not started on an edit: skipping the job instead would post its required check as passed.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: test-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The name is a required status check on main: a renamed job leaves every
  # merge waiting on a check that never reports.
  test:
    name: tests, format and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The runner images preinstall different toolchains, and rust-cache hashes every one it finds into its key.
      - run: |
          rustup toolchain install --profile minimal
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup default "$channel"
          rustup toolchain list | cut -d' ' -f1 | grep -v "^$channel-" | xargs -r -n1 rustup toolchain uninstall
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked -p cascade-bridge-wasm --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --locked
      - uses: actions/checkout@v7
        with:
          repository: jayostis/cascade-bridge-adapter-ccda
          path: cascade-bridge-adapter-ccda
          persist-credentials: false
      - run: bash .github/scripts/conformance-matches-adapter.sh cascade-bridge-adapter-ccda
