name: test

# Not started on an edit: skipping the job instead would post its required check as passed.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: test-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The name is a required status check on main: a renamed job leaves every
  # merge waiting on a check that never reports.
  test:
    name: tests, format and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustc --version
      - uses: Swatinem/rust-cache@v2
      # setup.sh fetches its tools into target/, which rust-cache does not keep.
      - uses: actions/cache@v6
        with:
          path: |
            target/wasm-bindgen-*
            target/binaryen-*
          key: node-host-tools-${{ hashFiles('Cargo.lock', 'hosts/node/setup.sh') }}
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: sh hosts/node/setup.sh
      - run: cargo clippy --locked -p cascade-bridge-wasm --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --locked
