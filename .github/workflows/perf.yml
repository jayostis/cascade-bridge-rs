# No logic here on purpose: the run lives in cascade-bridge-spec's perf action.
name: perf

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:
    inputs:
      which:
        description: "pull-requests: the inputs marked for pull requests. all: every input."
        type: choice
        options: [pull-requests, all]
        default: pull-requests

concurrency:
  group: perf-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The only job that may write to the repository, and only to its perf-data branch.
  perf-data:
    name: perf-data
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      - uses: jayostis/cascade-bridge-spec/.github/actions/perf@main
        with:
          publish: 'true'
          inputs: ${{ github.event_name == 'schedule' && 'all' || inputs.which || 'pull-requests' }}

  perf-pull-request:
    name: perf-pull-request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: jayostis/cascade-bridge-spec/.github/actions/perf@main
