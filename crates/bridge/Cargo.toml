[package]
name = "cascade-bridge"
description = "Cascade Bridge for Rust: runs Cascade Bridge Adapters under the sparql-1.1 profile."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
encoding_rs = "=0.8.35"
oxigraph = { version = "=0.5.11", default-features = false, features = ["rdf-12"] }
oxiri = "=0.2.11"
oxrdf = { version = "=0.3.4", features = ["rdfc-10"] }
oxrdfio = "=0.2.6"
oxsdatatypes = "=0.2.3"
quick-xml = "=0.37.5"
shacl = { git = "https://github.com/jayostis/rudof", rev = "1b6af3ba209ee731e1c4f5996557b84e2aaf7d29", default-features = false }
spargebra = { version = "=0.4.7", features = ["sep-0002", "sep-0006"] }
xpath-eval = "=0.2.2"
xsd-schema = "=0.2.0"
