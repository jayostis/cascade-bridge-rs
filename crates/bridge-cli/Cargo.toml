[package]
name = "cascade-bridge-cli"
description = "The cascade-bridge command: converts a document with an adapter, and runs an adapter's test manifest."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "cascade-bridge"
path = "src/main.rs"

[dependencies]
cascade-bridge = { path = "../bridge", version = "=0.1.0" }

[dev-dependencies]
oxrdf = "=0.3.4"
oxrdfio = "=0.2.6"
tempfile = "=3.27.0"
